# Tema de CanastAI: los mismos colores y la misma letra de la propuesta (CanastAI_Propuesta.pdf).
#   Verde de títulos y encabezados de tabla: #2E7D32
#   Azul de los enlaces:                     #0563C1
#   Letra: Arial
# Las clases de app.py (tarjetas, tabla de precios) usan estos mismos valores.

[theme]
base = "light"
primaryColor = "#2E7D32"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F7F3"
textColor = "#1B1B1B"
greenColor = "#2E7D32"
blueColor = "#0563C1"
linkColor = "#0563C1"
borderColor = "#D9DED9"
showWidgetBorder = true
showSidebarBorder = true

font = "Arial, Helvetica, sans-serif"
headingFont = "Arial, Helvetica, sans-serif"
headingFontWeights = [700, 700, 700, 700, 700, 700]
baseFontSize = 15
baseRadius = "0.6rem"
buttonRadius = "0.6rem"

metricValueFontWeight = 700
dataframeHeaderBackgroundColor = "#2E7D32"
dataframeHeaderTextColor = "#FFFFFF"

paddingTop = "3rem"

[client]
toolbarMode = "minimal"
